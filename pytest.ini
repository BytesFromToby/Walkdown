[pytest]
# Only Walkdown's own tests. Never collect from repos under audit, fixtures, or run
# outputs: collecting a test file imports it, and audited code must never run.
testpaths = stages grader tests
norecursedirs = ReposToExamine Fixtures RepoResults .venv .git
# Each stage has its own tests/ with files like test_run.py; importlib mode keeps
# same-named test modules in different stages from colliding.
addopts = --import-mode=importlib
