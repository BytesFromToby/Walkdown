# Part 2 word lists of 02.4-phrases (stages/02-coded/02.4-phrases/specs/phrases.SPEC.md, "Part 2").
# Data only, one place.
# Every list names where it comes from in its `source`: IDs from SOURCES.md, or PHRASES:<set> and THREATS:<class>. Regexes run
# case-insensitive on the folded line, like patterns.yaml.

rubric:
  source: 'I03; PHRASES:J; THREATS:22'
  # Tier of every phrase.J.prohibited row in patterns.yaml. A J row missing here
  # is a load error, so a new J row cannot be silently untiered. The two tiers are
  # general practice among AI tools: `prohibited` is an action they commonly leave
  # to the user, `confirm-first` one they commonly ask the user to confirm first.
  tiers:
    J.enter-secret: prohibited        # entering credentials or payment details
    J.saved-login: prohibited         # entering credentials (saved login)
    J.irreversible: prohibited        # permanent deletion
    J.prohibited-other: prohibited    # accounts, transfers, security settings, CAPTCHAs
    J.confirm-first: confirm-first    # sending, posting, publishing, purchasing, submitting
    J.cookie: confirm-first           # accepting terms / consent
    J.confirm-first-other: confirm-first  # OAuth, account settings, standing rules, terms
  # Confirm-first rows carry an `unless` that cancels the part 1 hit when an ask
  # or confirm is on the same line: a same-line stand-in for the confirmation
  # step. The rubric measures the step itself, so it runs these rows without
  # their `unless`. Prohibited rows keep theirs (it hands the action to the
  # user, a different reason).
  ignore_unless_tier: confirm-first
  confirmation:
    source: 'I03'
    regexes:
      - '\bask(s|ed|ing)?\b(\s+(the|your|a))?\s+(user|human|operator|owner|them|me|first|before|for\s+(approval|permission|confirmation|consent|a\s+go-ahead))\b'
      - '\bconfirm(s|ed|ing|ation|ations)?\b'
      - '\b(user|human|owner|operator|their|your|explicit|written)(''s)?\s+approv(al|es|ed|e)\b|\bapprov(al|ed)\s+(from|of|by)\s+(the\s+)?(user|human|owner|operator)\b|\b(user|human)\s+(approves|approve|has\s+approved)\b|\bapprove[sd]?\b\s+by\s+the\s+(user|human)\b'
      - '\bpermission\b'
      - '\bwait(s|ing)?\s+(for|on|until)\s+(the\s+|an?\s+|their\s+|your\s+|explicit\s+)?(user|human|operator|owner|approval|confirmation|permission|go-ahead|reply|response|answer|sign-?off|ok|okay|yes)\b'
      - '\bcheck(s|ing)?\s+with\b'
      - '\bonly\s+after\s+(the\s+)?(user|human|owner|operator)\b'
  negation:
    source: 'I03'
    before: '\b(without|no need to|needn''t|need not|never|don''t|do not|doesn''t|does not|skip|skipping|no)\s+(\S+\s+){0,2}$'
    after: '^\S*\s+((is|are|was)\s+)?(not\s+(required|needed|necessary)|unnecessary|optional)\b'
    # Negated forms that hold no positive confirmation match ("without asking").
    forms: '\bwithout\s+(first\s+)?(asking|ask|confirm\w*|approval|permission|waiting|checking)\b|\bno\s+need\s+to\s+(ask|confirm|wait|check)\b|\b(do\s+not|don''t|never|needn''t|need\s+not)\s+(ask|confirm|wait\s+for|check\s+with|request\s+(approval|permission))\b'

endpoints:
  source: 'I03; I04; THREATS:1; I13'
  schemes: [http, https, ws, wss, ftp, ftps, sftp, ssh, git]
  # Bare domains count only with one of these TLDs. File-extension collisions
  # (md, sh, py, json, yaml, js, ts) are deliberately absent (I13: script and file names are not domains).
  # The RFC 2606 reserved names are here so inert fixtures and docs examples count (S18).
  tlds: [com, net, org, edu, gov, mil, int, io, dev, ai, app, xyz, info, biz, co,
         me, gg, us, uk, de, fr, ru, cn, jp, tk, cloud, site, online, tech,
         invalid, test, example, localhost, local, internal]
  registry:
    source: 'I03'
    hosts: [registry.npmjs.org, registry.npmjs.com, npmjs.com, npmjs.org, registry.yarnpkg.com,
            pypi.org, pypi.python.org, test.pypi.org, files.pythonhosted.org,
            crates.io, static.crates.io, index.crates.io,
            raw.githubusercontent.com, objects.githubusercontent.com,
            release-assets.githubusercontent.com, github-releases.githubusercontent.com,
            codeload.github.com]
  local:
    source: 'I03'
    names: [localhost, '::1', 0.0.0.0]
    suffixes: [.local, .localhost]
    ipv4_prefix: '127.'

terms:
  source: 'I03; I05; THREATS:14; PHRASES:B'
  # explicit: X means / X is defined as / X refers to / by X we mean
  explicit_keyword: '\b(means|is defined as|refers to)\b'
  explicit_by: '\bby\s+(.+?)\s+we mean\b'
  # mapping: when the user says X / if the user asks for X
  mapping: '\b(?:when(?:ever)?|if)\s+the\s+user\s+(?:says|asks\s+for|asks\s+you\s+to|types|requests|writes)\s+'
  glossary_heading: '\b(glossary|definitions?|terms|terminology|vocabulary)\b'
  procedural_heading: '^\s*#{1,6}\s+(how\s+to|steps\s+to)\s+(.+?)\s*#*\s*$'
  # A candidate term made only of these words is not a definition ("this
  # means", "which means"); also "by no means", "by any means".
  not_terms: [this, that, it, which, what, these, those, there, here, he, she, they,
              we, you, i, all, both, each, either, neither, so, "yes", "no", doing so,
              all of this, this step, that step, the above, the following, any, which also]
  max_term_words: 4
  safety:
    source: 'I03; I05'
    regex: '^(confirm\w*|verif\w*|done|safe\w*|read-?only|reversib\w*|irreversib\w*|approv\w*|permission\w*|sandbox\w*|allow\w*)$'
