# Programs Walkdown recognizes when a script, an instruction, a hook, or an MCP server runs
# them (I14, plan for builders, slice 2, owner 2026-10-26). Only these count, so an ordinary word is
# never a program; one missing from the list is missed until it is added here. `os` marks a
# program that exists on one system only (unix: macOS and Linux, and Windows only through Git
# Bash or WSL). Checked 2026-10-26 against each system's own tools.

checked: 2026-10-26

programs:
  git: {}
  gh: {}
  jq: {}
  yq: {}
  curl: {}
  wget: {}
  node: {}
  npm: {}
  npx: {}
  pnpm: {}
  yarn: {}
  bun: {}
  deno: {}
  python: {}
  python3: {}
  py: {os: windows}
  pip: {}
  pip3: {}
  pipx: {}
  uv: {}
  uvx: {}
  poetry: {}
  docker: {}
  podman: {}
  kubectl: {}
  helm: {}
  terraform: {}
  aws: {}
  gcloud: {}
  az: {}
  make: {}
  cmake: {}
  go: {}
  cargo: {}
  rustc: {}
  java: {}
  mvn: {}
  gradle: {}
  ruby: {}
  gem: {}
  bundle: {}
  php: {}
  composer: {}
  dotnet: {}
  ffmpeg: {}
  ffprobe: {}
  pandoc: {}
  tesseract: {}
  playwright: {}
