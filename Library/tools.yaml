# Import names whose package to install has another name.
package_names:
  yaml: PyYAML
  PIL: Pillow
  bs4: beautifulsoup4
  fitz: PyMuPDF
  cv2: opencv-python
  sklearn: scikit-learn
  dateutil: python-dateutil
  docx: python-docx
  pptx: python-pptx
  dotenv: python-dotenv
  magic: python-magic
  jwt: PyJWT
  Crypto: pycryptodome
  serial: pyserial
  OpenSSL: pyOpenSSL
  attr: attrs
  google: google-api-python-client
  pkg_resources: setuptools
  pdfminer: pdfminer.six

# Node's built-in modules (also written with a node: prefix).
node_builtins: [assert, async_hooks, buffer, child_process, cluster, console, constants, crypto,
  dgram, dns, domain, events, fs, http, http2, https, inspector, module, net, os, path, perf_hooks,
  process, punycode, querystring, readline, repl, stream, string_decoder, timers, tls, trace_events,
  tty, url, util, v8, vm, wasi, worker_threads, zlib]

# Home folders that are not a person's: CI runners, containers, placeholders.
not_personal: [runner, node, vscode, user, username, you, yourname, your-name, your_name, me,
  name, foo, bar, example, someone, me, admin, ubuntu, root, codespace, jovyan, app]

# What ties a repository to one machine, in the order the report lists it (restructure step 3b,
# moved 2026-10-29 from the report code: PORT_KINDS in render.py and PORT_PLAIN in glance.py; the
# words are Walkdown's own). `check` is the finding the entry describes. `name` and `why` head its
# section in the full report and the details page. `plain` is the sentence on the summary page: {n}
# is the count, {s} an "s" unless the count is 1, and {was}, {them}, {v}, {v2}, {is} take the
# singular or plural form of the word the sentence needs. (A `noun` field, read by nothing, was dropped
# 2026-10-29: restructure notes M15 c.)
port_kinds:
  - check: port.path
    name: 'Personal paths'
    why: 'another machine has another user'
    plain: '{n} place{s} name a folder on the builder''s own computer (like C:\Users\name); nobody else has it.'
  - check: port.crlf
    name: 'Shell scripts with Windows line endings'
    why: 'bash fails on them'
    plain: '{n} shell script{s} {was} saved with Windows line endings; Mac and Linux can''t run {them}.'
  - check: port.os
    name: 'Scripts or commands for one system only'
    why: 'the other systems do not have them'
    plain: '{n} script{s} or command{s} only work on one kind of computer (Windows, or Mac and Linux).'
  - check: port.backslash
    name: 'References written with backslashes'
    why: 'macOS and Linux read the backslash as part of the name'
    plain: '{n} file path{s} use{v} backslashes; Mac and Linux read them as part of the name.'
  - check: port.exec
    name: 'Scripts run directly without the executable bit'
    why: 'macOS and Linux refuse to run them'
    plain: '{n} script{s} {is} run directly but not marked as runnable; Mac and Linux refuse {them}.'
  - check: port.python
    name: 'Runs python, not python3'
    why: 'macOS and many Linux systems have only python3'
    plain: 'It tells the AI to run <code>python</code> in {n} place{s}. Many Macs and Linux computers only have <code>python3</code>, so those steps may fail there.'
  - check: graph.case
    name: 'References that match only when case is ignored'
    why: 'Windows and macOS ignore case; Linux does not'
    plain: '{n} file name{s} only match{v2} if capital letters are ignored; that works on Windows and Mac, not Linux.'
