name: tests

# Every push and pull request: the spec tests, then every stage against its fixtures.
# Tesseract is installed here so stage 2's image check runs (locally it is optional and
# its absence gives INCOMPLETE); Playwright's Chromium likewise, so HTML is drawn. Stage 6 runs
# with no model backend: the packet gates only.
# Each runner version is named explicitly, so GitHub moving a "-latest" label cannot change
# results unannounced. Both Ubuntu versions are tested because their Tesseract differs; macOS and
# Windows (added 2026-10-20) run one Python each, to catch path, line-ending, and install
# differences. Fixtures keep their bytes on Windows through .gitattributes (Fixtures/** -text).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-26.04]
        python: ["3.12", "3.13"]
        include:
          - os: macos-15
            python: "3.13"
          - os: windows-2025
            python: "3.13"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install Tesseract (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -y -q tesseract-ocr
      - name: Install Tesseract (macOS)
        if: runner.os == 'macOS'
        run: brew install tesseract
      - name: Install Tesseract (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install tesseract -y --no-progress
          "C:\Program Files\Tesseract-OCR" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Install requirements
        run: python -m pip install -r requirements.txt pytesseract==0.3.13 playwright==1.64.0
      - name: Install Chromium for HTML drawing (Playwright)
        run: python -m playwright install chromium-headless-shell
      - name: Spec tests
        run: python -m pytest -q
      - name: Stage fixtures (grader)
        run: python grader/grader.py all
