name: tests

# Every push and pull request: the spec tests, then every stage against its fixtures.
# Nothing is installed but requirements.txt: no OCR program and no browser since R35 and R36
# (2026-11-11), the same as on a person's machine. The AI stages (03-sweep, 04-pinpoint) run with
# no model backend: Sweep's recall rows are skipped, and Pinpoint has no fixture set.
# Each runner version is named explicitly, so GitHub moving a "-latest" label cannot change
# results unannounced. Two Ubuntu versions with two Pythons; macOS and Windows (added 2026-10-20)
# run one Python each, to catch path, line-ending, and install differences. Fixtures keep their bytes on Windows through .gitattributes (Fixtures/** -text).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-26.04]
        python: ["3.12", "3.13"]
        include:
          - os: macos-15
            python: "3.13"
          - os: windows-2025
            python: "3.13"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install requirements
        run: python -m pip install -r requirements.txt
      - name: Spec tests
        run: python -m pytest -q
      - name: Stage fixtures (grader)
        run: python tools/grader/grader.py all
